name: Release

# A release starts when a push to main brings in the commit tagged v<package.json version>, not
# when the tag is pushed: bun run bump tags on the PR branch, before review.
on:
  push:
    branches: [main]

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history and tags
      - id: find
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          commit=$(git rev-parse -q --verify "refs/tags/$tag^{commit}") || { echo "no tag $tag: not a release"; exit 0; }
          if git merge-base --is-ancestor "$commit" "$BEFORE" 2>/dev/null; then
            echo "$tag was already on main: not a release"; exit 0
          fi
          # The release commit must be the PR's last commit (the merge's second parent), so fixes
          # pushed after bun run bump can't be left out of the release.
          if [ "$commit" != "$(git rev-parse HEAD)" ] && [ "$commit" != "$(git rev-parse -q --verify HEAD^2)" ]; then
            echo "$tag isn't the last commit of the merged PR: delete it and run bun run bump again"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [tag, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release create --draft
      id-token: write # npm trusted publishing and provenance
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # The tagged commit, not the merge: the package matches its CHANGELOG entry.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Staged publishing needs npm >= 11.15 (checked below); Node 24 ships 11.x.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # This job can stage on npm: run no install scripts, ours (lefthook) included.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: npm supports staged publishing
        run: |
          npm --version
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&b>=15)?0:1)' "$(npm --version)"
      - run: bun run build
      # The trusted publisher may only stage: the version goes public when a maintainer approves it
      # with 2FA (npm stage approve, or Staged Packages on npmjs.com). CI can't approve.
      - run: npm stage publish ./dist --access public --provenance
      # A draft, published by hand once the staged version is approved on npm.
      - name: GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          # Headings: "## [0.1.1](compare-url) (date)" from bun run bump, "## 0.1.0 — date" before it.
          awk -v v="$version" '$0 ~ "^## \\[?" v "([] ]|$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --draft
